name: Daily availability story

on:
  schedule:
    # GitHub cron is UTC. 19:00 Skopje = 17:00 UTC (summer) or 18:00 UTC (winter).
    # 14:00 Skopje = 12:00 UTC (summer) or 13:00 UTC (winter).
    # run_daily.py skips the run when the Skopje hour does not match.
    - cron: "0 17 * * *"
    - cron: "0 18 * * *"
    - cron: "0 12 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "morning or afternoon"
        required: true
        type: choice
        options: [morning, afternoon]
      date:
        description: "Class date, YYYY-MM-DD"
        required: true

permissions:
  contents: write

concurrency:
  group: daily-story
  cancel-in-progress: false

jobs:
  story:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fonts and Python packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core
          pip install -r requirements.txt

      - name: Render story
        id: render
        env:
          FORCE_KIND: ${{ github.event.inputs.kind }}
          FORCE_DATE: ${{ github.event.inputs.date }}
          WEREFORM_BASE_URL: https://wereform.mk
        run: python run_daily.py

      - name: Commit story image
        if: steps.render.outputs.file != ''
        run: |
          git config user.name "wereform-story bot"
          git config user.email "actions@users.noreply.github.com"
          git add "${{ steps.render.outputs.file }}"
          git commit -m "Story: ${{ steps.render.outputs.file }}"
          git push

      - name: Publish to Instagram
        if: steps.render.outputs.file != ''
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
        run: python publish_story.py "${{ steps.render.outputs.file }}"
