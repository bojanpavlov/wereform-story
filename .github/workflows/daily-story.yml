name: Daily availability story

on:
  schedule:
    # GitHub cron is UTC. Each run checks the slots 5 minutes before the post time.
    # 19:25 Skopje = 17:25 UTC (summer) or 18:25 UTC (winter): morning check, posts 19:30.
    # 09:55 Skopje = 07:55 UTC (summer) or 08:55 UTC (winter): afternoon check, posts 10:00.
    # run_daily.py skips a run whose Skopje time is outside its check window.
    - cron: "25 17 * * *"
    - cron: "25 18 * * *"
    - cron: "55 7 * * *"
    - cron: "55 8 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "morning or afternoon"
        required: true
        type: choice
        options: [morning, afternoon]
      date:
        description: "Class date, YYYY-MM-DD"
        required: true
      publish_delay_minutes:
        description: "Minutes to wait between the slot check and publishing (0 = publish at once)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: daily-story
  cancel-in-progress: false

jobs:
  story:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fonts and Python packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core
          pip install -r requirements.txt

      - name: Render story
        id: render
        env:
          FORCE_KIND: ${{ github.event.inputs.kind }}
          FORCE_DATE: ${{ github.event.inputs.date }}
          WEREFORM_BASE_URL: https://wereform.mk
        run: python run_daily.py

      - name: Commit story image
        if: steps.render.outputs.file != ''
        run: |
          git config user.name "wereform-story bot"
          git config user.email "actions@users.noreply.github.com"
          git add "${{ steps.render.outputs.file }}"
          if git diff --cached --quiet; then
            echo "Image already committed; nothing to commit."
          else
            git commit -m "Story: ${{ steps.render.outputs.file }}"
            git push
          fi

      - name: Publish to Instagram
        if: steps.render.outputs.file != ''
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
          # Set only on scheduled runs: the publish waits for the post time.
          POST_KIND: ${{ steps.render.outputs.kind }}
          DELAY_MINUTES: ${{ github.event.inputs.publish_delay_minutes }}
        run: |
          if [ -n "$DELAY_MINUTES" ] && [ "$DELAY_MINUTES" -gt 0 ]; then
            echo "Slots were checked; waiting $DELAY_MINUTES minute(s) before publishing"
            sleep $((DELAY_MINUTES * 60))
          fi
          python publish_story.py "${{ steps.render.outputs.file }}"
